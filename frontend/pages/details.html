<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address & Payment - KrishiMandi</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/details.css">
</head>
<body class="auth-bg">
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <a href="../index.html" class="logo">KrishiMandi</a>
                <h2>Complete your Profile</h2>
                <p>Provide your location and payout information</p>
            </div>

            <form id="details-form" class="auth-form details-form">
                <div class="error-toast" id="details-error" style="margin-bottom: 14px;"></div>
                <div class="auth-grid">

                    <!-- Left column: Address Details -->
                    <div class="auth-col">
                        <div class="col-header">
                            <span class="section-label">Address Details</span>
                            <span class="section-hint">Enter your delivery & pickup location</span>
                        </div>
                        <hr class="col-divider">

                        <!-- Farmer / User Full Name Field -->
                        <div class="form-field">
                            <label for="fullname">Farmer / User Full Name</label>
                            <div class="input-wrapper">
                                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                <input type="text" id="fullname" name="fullname" placeholder="e.g. Ramesh Patil">
                            </div>
                        </div>

                        <!-- Address Line 1 -->
                        <div class="form-field">
                            <label for="address1">Address Line 1 (House No, Street)</label>
                            <div class="input-wrapper">
                                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                                <input type="text" id="address1" name="address1" placeholder="e.g. 123 Main Street" required>
                            </div>
                        </div>

                        <!-- Address Line 2 -->
                        <div class="form-field">
                            <label for="address2">Address Line 2 (Village / Area)</label>
                            <div class="input-wrapper">
                                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                <input type="text" id="address2" name="address2" placeholder="e.g. Near Panchayat Bhawan">
                            </div>
                        </div>

                        <!-- City / District + Pincode Row -->
                        <div class="field-row">
                            <div class="form-field">
                                <label for="city">City / District</label>
                                <div class="input-wrapper">
                                    <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="22.01"></line><line x1="15" y1="22" x2="15" y2="22.01"></line><line x1="9" y1="18" x2="9" y2="18.01"></line><line x1="15" y1="18" x2="15" y2="18.01"></line><line x1="9" y1="14" x2="9" y2="14.01"></line><line x1="15" y1="14" x2="15" y2="14.01"></line><line x1="9" y1="10" x2="9" y2="10.01"></line><line x1="15" y1="10" x2="15" y2="10.01"></line><line x1="9" y1="6" x2="9" y2="6.01"></line><line x1="15" y1="6" x2="15" y2="6.01"></line></svg>
                                    <input type="text" id="city" name="city" placeholder="e.g. Pune" required>
                                </div>
                            </div>
                            <div class="form-field">
                                <label for="pincode">Pincode</label>
                                <div class="input-wrapper">
                                    <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
                                    <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" placeholder="400001" maxlength="6" inputmode="numeric" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right column: State, Aadhaar Verification + UPI -->
                    <div class="auth-col">
                        <div class="col-header">
                            <span class="section-label">Identity & Payment</span>
                            <span class="section-hint">Select region & settlement ID</span>
                        </div>
                        <hr class="col-divider">

                        <!-- State Dropdown -->
                        <div class="form-field">
                            <label for="state">State</label>
                            <div class="input-wrapper select-wrapper">
                                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
                                <select id="state" name="state" required>
                                    <option value="">Select State</option>
                                    <option>Andhra Pradesh</option>
                                    <option>Arunachal Pradesh</option>
                                    <option>Assam</option>
                                    <option>Bihar</option>
                                    <option>Chhattisgarh</option>
                                    <option>Goa</option>
                                    <option>Gujarat</option>
                                    <option>Haryana</option>
                                    <option>Himachal Pradesh</option>
                                    <option>Jharkhand</option>
                                    <option>Karnataka</option>
                                    <option>Kerala</option>
                                    <option>Madhya Pradesh</option>
                                    <option>Maharashtra</option>
                                    <option>Manipur</option>
                                    <option>Meghalaya</option>
                                    <option>Mizoram</option>
                                    <option>Nagaland</option>
                                    <option>Odisha</option>
                                    <option>Punjab</option>
                                    <option>Rajasthan</option>
                                    <option>Sikkim</option>
                                    <option>Tamil Nadu</option>
                                    <option>Telangana</option>
                                    <option>Tripura</option>
                                    <option>Uttar Pradesh</option>
                                    <option>Uttarakhand</option>
                                    <option>West Bengal</option>
                                    <option>Delhi</option>
                                </select>
                                <svg class="select-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </div>
                        </div>

                        <!-- Aadhaar Card Number (Verification) -->
                        <div class="form-field">
                            <label for="aadhar">Aadhaar Number (for Verification)</label>
                            <div class="input-wrapper">
                                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                                    <circle cx="9" cy="10" r="2"></circle>
                                    <line x1="15" y1="8" x2="17" y2="8"></line>
                                    <line x1="15" y1="12" x2="17" y2="12"></line>
                                    <line x1="7" y1="16" x2="17" y2="16"></line>
                                </svg>
                                <input type="text" id="aadhar" name="aadhar" placeholder="XXXX XXXX XXXX" maxlength="14" inputmode="numeric" required>
                            </div>
                        </div>

                        <!-- UPI ID -->
                        <div class="form-field">
                            <label for="upi">UPI ID (For direct settlements)</label>
                            <div class="input-wrapper">
                                <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                                <input type="text" id="upi" name="upi" placeholder="e.g. 9876543210@ybl" required>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Bottom Submit Button -->
                <div class="form-submit-row">
                    <button type="submit" id="complete-btn" class="btn btn-primary btn-submit-full">Complete Profile →</button>
                    <p class="terms-text">Secure 256-bit encrypted transfer with KrishiMandi Partner Network.</p>
                </div>
            </form>

            <!-- Success overlay — covers the card on submit -->
            <div class="success-overlay" id="success-overlay">
                <svg class="success-tick" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="44" class="tick-circle"/>
                    <path d="M27 52 L42 67 L73 33" class="tick-mark"/>
                </svg>
                <p class="success-text">Account Created Successfully!</p>
            </div>

        </div>
    </div>

    <script src="../script/details.js"></script>
</body>
</html>
