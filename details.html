<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address & Payment - KrishiMandi</title>
    <link rel="stylesheet" href="card.css">
</head>
<body class="auth-bg">
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <a href="index.html" class="logo">Complete your Profile</a>
            </div>

            <form action="index.html" method="GET">
                <div class="form-grid">

                    <!-- Left column: Address -->
                    <div class="form-col">
                        <span class="section-label">Address Details</span>
                        <hr class="divider">

                        <div class="field">
                            <label>Address Line 1 (House No, Street)</label>
                            <input type="text" name="address1" placeholder="e.g. 123 Main Street" required>
                        </div>

                        <div class="field">
                            <label>Address Line 2 (Village / Area)</label>
                            <input type="text" name="address2" placeholder="e.g. Near Panchayat Bhawan">
                        </div>

                        <div class="field-row">
                            <div class="field">
                                <label>City / District</label>
                                <input type="text" name="city" required>
                            </div>
                            <div class="field">
                                <label>Pincode</label>
                                <input type="text" name="pincode" pattern="[0-9]{6}" placeholder="400001" required>
                            </div>
                        </div>
                    </div>

                    <!-- Right column: State + UPI -->
                    <div class="form-col">
                        <span class="section-label">State & Payment</span>
                        <hr class="divider">

                        <div class="field">
                            <label>State</label>
                            <select name="state" required>
                                <option value="">Select State</option>
                                <option>Andhra Pradesh</option>
                                <option>Arunachal Pradesh</option>
                                <option>Assam</option>
                                <option>Bihar</option>
                                <option>Chhattisgarh</option>
                                <option>Goa</option>
                                <option>Gujarat</option>
                                <option>Haryana</option>
                                <option>Himachal Pradesh</option>
                                <option>Jharkhand</option>
                                <option>Karnataka</option>
                                <option>Kerala</option>
                                <option>Madhya Pradesh</option>
                                <option>Maharashtra</option>
                                <option>Manipur</option>
                                <option>Meghalaya</option>
                                <option>Mizoram</option>
                                <option>Nagaland</option>
                                <option>Odisha</option>
                                <option>Punjab</option>
                                <option>Rajasthan</option>
                                <option>Sikkim</option>
                                <option>Tamil Nadu</option>
                                <option>Telangana</option>
                                <option>Tripura</option>
                                <option>Uttar Pradesh</option>
                                <option>Uttarakhand</option>
                                <option>West Bengal</option>
                                <option>Delhi</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>UPI ID</label>
                            <input type="text" name="upi" placeholder="e.g. 9876543210@ybl" required>
                        </div>
                    </div>

                    <!-- Button spanning both columns -->
                    <div class="btn-submit span-two">
                        <button type="submit" id="complete-btn" class="btn-full">Complete Profile →</button>
                    </div>

                </div>
            </form>

            <!-- Success overlay — covers the card on submit -->
            <div class="success-overlay" id="success-overlay">
                <svg class="success-tick" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="44" class="tick-circle"/>
                    <path d="M27 52 L42 67 L73 33" class="tick-mark"/>
                </svg>
                <p class="success-text">Account Created!</p>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('complete-btn').addEventListener('click', function (e) {
            e.preventDefault();

            const overlay = document.getElementById('success-overlay');
            overlay.classList.add('active');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2800);
        });
    </script>
</body>
</html>
